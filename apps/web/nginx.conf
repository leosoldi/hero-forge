server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Upload de avatar aceita até 2 MB; a folga cobre o overhead do multipart
  client_max_body_size 3m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Mesmo contrato do proxy do Vite em desenvolvimento: /api/heroes -> api:3333/heroes
  location /api/ {
    proxy_pass http://api:3333/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A geração de texto + imagem pela IA pode levar alguns segundos
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    proxy_pass http://api:3333/uploads/;
  }

  # Arquivos do Vite têm hash no nome, então podem ficar em cache "para sempre"
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: qualquer outra rota cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
